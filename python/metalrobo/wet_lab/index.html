<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>NumiLab · Laboratory</title><link rel="stylesheet" href="/workbench.css"></head><body>
<a class="skip" href="#biological-view">Skip to specimen</a>
<header class="appbar"><button id="nav-toggle" aria-label="Toggle navigation" aria-expanded="true">☰</button><a class="brand" href="/">Numi<span>Lab</span><small>Virtual Wet Lab</small></a><span id="dataset-name">Laboratory</span><span id="connection" role="status">Connecting…</span><button id="command-open">Search / commands <kbd>⌘ K</kbd></button><button id="appearance" aria-label="Change appearance">◐</button><button id="activity-open">Activity</button><button id="evidence-open">Evidence</button></header>
<div id="notice" role="status" hidden></div><div id="conflict" role="alert" hidden></div>
<div class="workbench"><nav id="navigation" aria-label="Laboratory navigation"></nav><main id="main"><div id="start"></div><section id="investigation" hidden><div id="selection-toolbar" class="selection-toolbar"></div><div class="workspace-grid"><section id="biological-view" tabindex="-1" aria-label="Biological specimen"><div id="view-heading"></div><div id="view-content"></div></section><aside id="inspector" aria-label="Selection and experiment proposal"></aside></div><section id="comparison" hidden aria-label="Persistent comparison"></section></section></main></div>
<dialog id="drawer"><div class="drawer-header"><h2 id="drawer-title"></h2><button id="drawer-close" aria-label="Close drawer">×</button></div><div id="drawer-content"></div></dialog>
<dialog id="command"><form method="dialog"><div class="drawer-header"><h2>Search the laboratory</h2><button aria-label="Close search">×</button></div></form><input id="command-query" type="search" placeholder="Dataset, experiment or command" aria-label="Search datasets, experiments and commands"><div id="command-results"></div></dialog>
<dialog id="reveal-dialog"><h2>Authorize observation reveal</h2><p id="reveal-description"></p><p>This opens the specified held-out measurements and records access permanently. Predictions remain sealed.</p><div class="actions"><button id="reveal-cancel">Keep closed</button><button id="reveal-confirm" class="primary">Authorize reveal</button></div></dialog>
<script nonce="__TOKEN__">window.WET_LAB_TOKEN="__TOKEN__";</script><script nonce="__TOKEN__" type="module" src="/assets/main.js"></script></body></html>
