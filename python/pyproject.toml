[build-system]
requires = [
    "setuptools>=69",
]
build-backend = "setuptools.build_meta"

[project]
name = "metalrobo"
version = "0.4.0"
description = "MLX learning and data adapters for MetalRobo's native runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "mlx>=0.32,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.scripts]
metalrobo = "metalrobo.cli:main"
metalrobo-tactile = "metalrobo.tactile_cli:main"

[project.optional-dependencies]
tactile-dataset = [
    "av>=12,<17",
    "huggingface_hub>=0.29,<2",
    "pyarrow>=18,<24",
]
g1-deployment = [
    "coremltools>=8,<10",
    "mujoco>=3.2,<4",
    "onnx>=1.17,<2",
]

[tool.setuptools]
packages = ["metalrobo"]

[tool.setuptools.package-data]
metalrobo = ["*.so", "*.dylib", "*.metallib", "py.typed"]
