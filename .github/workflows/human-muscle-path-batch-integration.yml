name: Integrate batched Human muscle paths
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/human-muscle-path-batch-integration.yml]
permissions:
  contents: write
concurrency:
  group: human-muscle-path-batch-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Numi2/numilab-human
          ref: 21f27ccbd6562022103267bde6f2e7ef680eea9d
          path: human-inputs
          sparse-checkout: Docs/media/native-runtime-source-package-20260915
      - name: Capture the unchanged scalar oracle
        run: |
          set -eu
          mkdir -p human-batch-evidence human-release-evidence
          clang++ -std=c++20 -O2 -fno-fast-math -ffp-contract=off -DHUMAN_SCALAR_ORACLE_ONLY -Iinclude tests/mujoco_muscle_path_batch_test.cpp src/core/MujocoMuscleReference.cpp src/core/ArticulatedDynamics.cpp src/core/OpenSimSpatialTransform.cpp src/core/OpenSimFunction.cpp -o /tmp/human-path-old
          /tmp/human-path-old | tee human-batch-evidence/scalar-before.txt
      - name: Reuse the source geometry owner and batch immutable pose queries
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          guards={'CMakeLists.txt':'7473ae4d691f9ea9a9eb58477249bfb064dc59ce','include/metalrobo/MujocoMuscleReference.hpp':'4cd087e07336005b2878ec1ea3a85b1a45e500e9','src/core/MujocoMuscleReference.cpp':'5560d10d8e9c4ae2dc0a33d3e09c648bbea77f00','src/core/NumiHumanMuscleEquilibrium.cpp':'a58d6c07b544a43a1114401ca34bfdc4448a13cc'}
          for path,sha in guards.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path+' changed'
          p=Path('src/core/MujocoMuscleReference.cpp');s=p.read_text()
          a=s.index('MujocoMuscleReferenceDiagnostics resolvePath(');b=s.index('\ndouble muscleGainLength',a)
          old=s[a:b]
          g0=old.index('    auto body =');g1=old.index('    std::vector<ArticulatedPointQuery> queries;')
          geometry=old[g0:g1].replace('    std::vector<Segment> segments;','    segments.clear();')
          new='''// One route-geometry owner is shared by scalar and batch callers. Batching
          // only amortizes articulation kinematics and point-Jacobian preparation.
          MujocoMuscleReferenceDiagnostics resolvePathGeometry(
              const MRArticulationGPU& articulation,
              const std::span<const ArticulatedBodyKinematics> bodies,
              const std::span<const MujocoMuscleSite> sites,
              const std::span<const MujocoWrapGeometry> wraps,
              const MujocoMuscleDefinition& definition,
              MujocoMusclePathResult& result,
              std::vector<Segment>& segments
          ) {
              if (!validDefinition(definition, sites, wraps))
                  return failure(MujocoMuscleReferenceStatus::invalidDefinition);
              result = {};
          '''+geometry+'''    result.length = length;
              result.appliedWrapCount = appliedWraps;
              return {};
          }

          MujocoMuscleReferenceDiagnostics finishPathJacobian(
              const std::span<const Segment> segments,
              const std::span<const double> jacobians,
              const std::span<const double> v,
              MujocoMusclePathResult& result
          ) {
              const std::size_t nv = v.size();
          '''
          f0=old.index('    result.lengthJacobian.assign(')
          new+=old[f0:].replace('articulation.nv','nv')+'\n'
          new+='''MujocoMuscleReferenceDiagnostics resolvePath(
              const EngineModel& model, const std::uint32_t articulationIndex, const std::span<const double> q,
              const std::span<const double> v, const std::span<const MujocoMuscleSite> sites,
              const std::span<const MujocoWrapGeometry> wraps, const MujocoMuscleDefinition& definition,
              MujocoMusclePathResult& result, const ArticulatedDynamicsConfig& config
          ) {
              if (!validDefinition(definition, sites, wraps)) return failure(MujocoMuscleReferenceStatus::invalidDefinition);
              if (articulationIndex >= model.articulations.size()) return failure(MujocoMuscleReferenceStatus::invalidState);
              const auto& articulation = model.articulations[articulationIndex];
              if (q.size() != articulation.nq || v.size() != articulation.nv) return failure(MujocoMuscleReferenceStatus::invalidState);
              std::vector<ArticulatedBodyKinematics> bodies(articulation.bodyCount);
              if (!computeArticulatedBodyKinematics(model, articulationIndex, q, v, bodies, config).succeeded())
                  return failure(MujocoMuscleReferenceStatus::kinematicsFailure);
              std::vector<Segment> segments;
              auto diagnostics = resolvePathGeometry(articulation, bodies, sites, wraps, definition, result, segments);
              if (!diagnostics.succeeded()) return diagnostics;
              std::vector<ArticulatedPointQuery> queries;
              queries.reserve(segments.size() * 2u);
              for (const Segment& segment : segments) {
                  queries.push_back({segment.first.bodyIndex, segment.first.local});
                  queries.push_back({segment.second.bodyIndex, segment.second.local});
              }
              std::vector<ArticulatedPointKinematics> kinematics(queries.size());
              std::vector<double> jacobians(queries.size() * 3u * articulation.nv);
              if (!computeArticulatedPointJacobians(model, articulationIndex, q, v, queries,
                                                  kinematics, jacobians, config).succeeded())
                  return failure(MujocoMuscleReferenceStatus::kinematicsFailure);
              return finishPathJacobian(segments, jacobians, v, result);
          }
          '''
          s=s[:a]+new+s[b:]
          anchor='MujocoMuscleReferenceDiagnostics evaluateMujocoMuscle(\n'
          assert s.count(anchor)==1
          batch='''MujocoMuscleReferenceDiagnostics evaluateMujocoMusclePaths(
              const EngineModel& model, const std::uint32_t articulationIndex,
              const std::span<const double> q, const std::span<const double> v,
              const std::span<const MujocoMuscleSite> sites,
              const std::span<const MujocoWrapGeometry> wraps,
              const std::span<const MujocoMuscleDefinition> definitions,
              std::vector<MujocoMusclePathResult>& results,
              const ArticulatedDynamicsConfig& config
          ) {
              if (articulationIndex >= model.articulations.size())
                  return failure(MujocoMuscleReferenceStatus::invalidState);
              const auto& articulation = model.articulations[articulationIndex];
              if (q.size() != articulation.nq || v.size() != articulation.nv ||
                  definitions.size() >= MR_INVALID_INDEX)
                  return failure(MujocoMuscleReferenceStatus::invalidState);
              std::vector<ArticulatedBodyKinematics> bodies(articulation.bodyCount);
              if (!computeArticulatedBodyKinematics(model, articulationIndex, q, v, bodies, config).succeeded())
                  return failure(MujocoMuscleReferenceStatus::kinematicsFailure);
              std::vector<MujocoMusclePathResult> candidate(definitions.size());
              // Bound temporary Jacobian memory independently of the muscle population.
              // The source-order arithmetic for each route is identical to scalar calls.
              constexpr std::size_t routeBatchSize = 32u;
              for (std::size_t begin = 0u; begin < definitions.size(); begin += routeBatchSize) {
                  const std::size_t end = std::min(begin + routeBatchSize, definitions.size());
                  std::vector<std::vector<Segment>> routes(end - begin);
                  std::vector<ArticulatedPointQuery> queries;
                  for (std::size_t index = begin; index < end; ++index) {
                      auto& segments = routes[index - begin];
                      auto diagnostics = resolvePathGeometry(articulation, bodies, sites, wraps,
                          definitions[index], candidate[index], segments);
                      if (!diagnostics.succeeded()) {
                          diagnostics.failingIndex = static_cast<std::uint32_t>(index);
                          return diagnostics;
                      }
                      for (const Segment& segment : segments) {
                          queries.push_back({segment.first.bodyIndex, segment.first.local});
                          queries.push_back({segment.second.bodyIndex, segment.second.local});
                      }
                  }
                  const std::size_t rowStride = 3u * static_cast<std::size_t>(articulation.nv);
                  if (rowStride != 0u && queries.size() > std::numeric_limits<std::size_t>::max() / rowStride)
                      return failure(MujocoMuscleReferenceStatus::invalidState);
                  std::vector<ArticulatedPointKinematics> kinematics(queries.size());
                  std::vector<double> jacobians(queries.size() * rowStride);
                  if (!computeArticulatedPointJacobians(model, articulationIndex, q, v, queries,
                                                      kinematics, jacobians, config).succeeded())
                      return failure(MujocoMuscleReferenceStatus::kinematicsFailure);
                  std::size_t offset = 0u;
                  for (std::size_t index = begin; index < end; ++index) {
                      const auto& segments = routes[index - begin];
                      const std::size_t count = segments.size() * 2u * rowStride;
                      auto diagnostics = finishPathJacobian(segments,
                          std::span<const double>(jacobians).subspan(offset, count), v, candidate[index]);
                      if (!diagnostics.succeeded()) {
                          diagnostics.failingIndex = static_cast<std::uint32_t>(index);
                          return diagnostics;
                      }
                      offset += count;
                  }
              }
              results = std::move(candidate);
              return {};
          }

          '''
          s=s.replace(anchor,batch+anchor);p.write_text(s)
          p=Path('include/metalrobo/MujocoMuscleReference.hpp');s=p.read_text();a=s.index("// Evaluates MyoSim's source spatial route")
          s=s[:a]+'''// Evaluate source-ordered paths at one immutable q/v. Reuses the existing
          // route geometry and articulated point-Jacobian owners, preparing body poses
          // once and bounding temporary Jacobians to 32 routes per batch. Does not cache
          // across calls or poses. On failure results are unchanged; failingIndex names
          // the muscle for route errors and remains the sentinel for shared-state errors.
          [[nodiscard]] MujocoMuscleReferenceDiagnostics evaluateMujocoMusclePaths(
              const EngineModel& model,
              std::uint32_t articulationIndex,
              std::span<const double> q,
              std::span<const double> v,
              std::span<const MujocoMuscleSite> sites,
              std::span<const MujocoWrapGeometry> wraps,
              std::span<const MujocoMuscleDefinition> definitions,
              std::vector<MujocoMusclePathResult>& results,
              const ArticulatedDynamicsConfig& config = {}
          );

          '''+s[a:];p.write_text(s)
          p=Path('src/core/NumiHumanMuscleEquilibrium.cpp');s=p.read_text()
          old='''    std::vector<ResolvedMuscle> candidate(muscles.size());
              for (std::size_t muscle = 0u; muscle < muscles.size(); ++muscle) {
                  MujocoMuscleResult path;
                  const auto diagnostics = evaluateMujocoMuscle(
                      model, articulationIndex, q, zeroVelocity, sites, wraps,
                      muscles[muscle], {}, path, dynamicsConfig
                  );
                  if (!diagnostics.succeeded()) {
                      auto failed = failure(
                          NumiHumanMuscleEquilibriumStatus::kinematicsFailure,
                          static_cast<std::uint32_t>(muscle)
                      );
                      failed.muscleStatus = diagnostics.status;
                      return failed;
                  }
                  if (!(path.path.length > kMinimum) ||
                      path.path.lengthJacobian.size() != nv ||
                      !finiteSpan(path.path.lengthJacobian)) {'''
          new='''    std::vector<MujocoMusclePathResult> paths;
              const auto diagnostics = evaluateMujocoMusclePaths(
                  model, articulationIndex, q, zeroVelocity, sites, wraps,
                  muscles, paths, dynamicsConfig);
              if (!diagnostics.succeeded()) {
                  auto failed = failure(NumiHumanMuscleEquilibriumStatus::kinematicsFailure,
                                        diagnostics.failingIndex);
                  failed.muscleStatus = diagnostics.status;
                  return failed;
              }
              std::vector<ResolvedMuscle> candidate(muscles.size());
              for (std::size_t muscle = 0u; muscle < muscles.size(); ++muscle) {
                  auto& path = paths[muscle];
                  if (!(path.length > kMinimum) ||
                      path.lengthJacobian.size() != nv ||
                      !finiteSpan(path.lengthJacobian)) {'''
          assert s.count(old)==1;s=s.replace(old,new)
          s=s.replace('candidate[muscle].pathLength = path.path.length;','candidate[muscle].pathLength = path.length;').replace('candidate[muscle].jacobian = std::move(path.path.lengthJacobian);','candidate[muscle].jacobian = std::move(path.lengthJacobian);')
          p.write_text(s)
          p=Path('CMakeLists.txt');s=p.read_text();old='    set_tests_properties(numi_human_static_support PROPERTIES LABELS "numi-human;mechanics;support")'
          assert s.count(old)==1
          s=s.replace(old,old+'''
              add_executable(metalrobo_mujoco_muscle_path_batch_test tests/mujoco_muscle_path_batch_test.cpp)
              target_link_libraries(metalrobo_mujoco_muscle_path_batch_test PRIVATE metalrobo)
              target_compile_options(metalrobo_mujoco_muscle_path_batch_test PRIVATE -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off)
              set_target_properties(metalrobo_mujoco_muscle_path_batch_test PROPERTIES
                  RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/bin")
              add_test(NAME mujoco_muscle_path_batch COMMAND metalrobo_mujoco_muscle_path_batch_test)
              set_tests_properties(mujoco_muscle_path_batch PROPERTIES LABELS "numi-human;mechanics;muscle")''')
          p.write_text(s)
      - name: Compare bitwise source-oracle outputs before building
        run: |
          set -eu
          clang++ -std=c++20 -O2 -fno-fast-math -ffp-contract=off -Iinclude tests/mujoco_muscle_path_batch_test.cpp src/core/MujocoMuscleReference.cpp src/core/ArticulatedDynamics.cpp src/core/OpenSimSpatialTransform.cpp src/core/OpenSimFunction.cpp -o /tmp/human-path-batch
          /tmp/human-path-batch | tee human-batch-evidence/batch-after.txt
          python3 - <<'PY'
          import pathlib,re
          def fingerprint(name):
              return re.search(r'valid_fingerprint=(\d+)',pathlib.Path('human-batch-evidence',name).read_text()).group(1)
          assert fingerprint('scalar-before.txt')==fingerprint('batch-after.txt')
          PY
          git diff --check
      - name: Select the installed Metal 4 toolchain
        shell: python
        run: |
          import os,pathlib,subprocess,tempfile
          with tempfile.TemporaryDirectory() as tmp:
              source=pathlib.Path(tmp)/'probe.metal'
              source.write_text('#include <metal_stdlib>\nusing namespace metal;\nkernel void probe(device float* p [[buffer(0)]]) { p[0]=0; }\n')
              for app in sorted(pathlib.Path('/Applications').glob('Xcode*.app'),reverse=True):
                  developer=str(app/'Contents/Developer')
                  env={**os.environ,'DEVELOPER_DIR':developer}
                  result=subprocess.run(['xcrun','--sdk','macosx','metal','-std=metal4.0','-c',str(source),'-o',tmp+'/probe.air'],env=env,capture_output=True,timeout=30)
                  if result.returncode==0:
                      with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVELOPER_DIR='+developer+'\n')
                      break
              else: raise RuntimeError('No installed Metal 4 compiler')
      - name: Build owning targets and run geometry and root regressions
        run: |
          set -eu
          cmake -S . -B BuildHuman -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON > human-batch-evidence/configure.txt 2>&1
          cmake --build BuildHuman --target metalrobo_numi_human_static_support_test metalrobo_mujoco_muscle_path_batch_test metalrobo_numi_human_root_placement_test metalrobo_numilab_human_myosim_visual_probe --parallel 3 > human-batch-evidence/build.txt 2>&1
          ctest --test-dir BuildHuman --output-on-failure -R '^(numi_human_static_support|mujoco_muscle_path_batch|numi_human_root_placement)$' | tee human-batch-evidence/ctest.txt
          python3 tools/check_human_host_syntax.py
          python3 tools/check_human_constraint_owner.py
      - name: Publish source-only optimization
        run: |
          set -eu
          git add -- CMakeLists.txt include/metalrobo/MujocoMuscleReference.hpp src/core/MujocoMuscleReference.cpp src/core/NumiHumanMuscleEquilibrium.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Batch immutable Human muscle paths through the existing kinematic owner'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > human-batch-evidence/native-revision.txt
          git diff HEAD^ HEAD > human-batch-evidence/change.patch
      - name: Repeat the 64-step release under the unchanged 300-second limit
        shell: python
        run: |
          import pathlib,textwrap,json
          # Reuse the existing source-locked runner, not a second evidence policy.
          text=pathlib.Path('.github/workflows/human-bounded-release.yml').read_text()
          anchor='      - name: Run mechanics-only common-duration cases without root assistance\n        shell: python\n        run: |\n'
          assert text.count(anchor)==1
          code=textwrap.dedent(text.split(anchor,1)[1].split('      - uses: actions/upload-artifact@v4',1)[0])
          old="cases=[('control-12p5us',0.0000125,1),('100us',0.0001,64),('50us',0.00005,128),('25us',0.000025,256),('12p5us',0.0000125,512)]"
          assert code.count(old)==1
          code=code.replace(old,"cases=[('100us',0.0001,64)]")
          pathlib.Path('human-release-evidence/device-preflight.json').write_text(json.dumps({'execution_environment':'GitHub macos-26 Apple Paravirtual; actual device in native result','physical_M4_qualification':False}))
          exec(compile(code,'existing-source-locked-release','exec'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-batched-path-and-release-evidence
          path: |
            human-batch-evidence
            human-release-evidence
            CMakeLists.txt
            include/metalrobo/MujocoMuscleReference.hpp
            src/core/MujocoMuscleReference.cpp
            src/core/NumiHumanMuscleEquilibrium.cpp
            tests/mujoco_muscle_path_batch_test.cpp
          retention-days: 14
          if-no-files-found: error
