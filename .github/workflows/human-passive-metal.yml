name: Human production-kernel regressions
on:
  push:
    branches: [human-native-runtime-20260915]
    paths:
      - tests/numi_human_passive_metal_test.mm
      - tests/numi_human_friction_metal_test.mm
      - tests/numi_human_bilateral_metal_test.mm
      - src/metal/NumiHumanStand.metal
      - include/metalrobo/numi_human_passive_joint.h
      - include/metalrobo/numi_human_stand_gpu.h
      - include/metalrobo/numi_human_constraint_projection.h
      - include/metalrobo/numi_human_friction.h
      - include/metalrobo/numi_human_bilateral.h
      - .github/workflows/human-passive-metal.yml
  pull_request:
    paths:
      - tests/numi_human*metal_test.mm
      - src/metal/NumiHumanStand.metal
      - include/metalrobo/numi_human*.h
      - .github/workflows/human-passive-metal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-kernel:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the production kernel and all integration fixtures
        run: |
          set -eu
          mkdir -p human-gpu-evidence
          git rev-parse HEAD > human-gpu-evidence/revision.txt
          xcrun --sdk macosx metal -std=metal4.0 -fno-fast-math -Iinclude -c src/metal/NumiHumanStand.metal -o /tmp/NumiHumanStand.air
          xcrun --sdk macosx metallib /tmp/NumiHumanStand.air -o /tmp/NumiHumanStand.metallib
          for name in passive friction bilateral; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-fast-math -fobjc-arc -Iinclude tests/numi_human_${name}_metal_test.mm -framework Foundation -framework Metal -o /tmp/human-${name}-metal
          done
      - name: Execute actual kernel regressions when a device is exposed
        run: |
          set -eu
          for name in passive friction bilateral; do
            set +e
            MTL_DEBUG_LAYER=1 /tmp/human-${name}-metal /tmp/NumiHumanStand.metallib > human-gpu-evidence/${name}-stdout.txt 2> human-gpu-evidence/${name}-stderr.txt
            code=$?
            set -e
            cat human-gpu-evidence/${name}-stdout.txt human-gpu-evidence/${name}-stderr.txt
            printf 'exit_code=%s\n' "$code" > human-gpu-evidence/${name}-exit.txt
            if [ "$code" = 77 ]; then
              echo 'Metal device absent: execution not run, not a numerical pass.' >> "$GITHUB_STEP_SUMMARY"
            elif [ "$code" != 0 ]; then
              exit "$code"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-production-kernel-results
          path: human-gpu-evidence
          retention-days: 14
          if-no-files-found: warn
