name: Audit Human velocity transport
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/human-velocity-transport-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate embedded transport difference
        shell: python
        run: |
          import ast, difflib, pathlib
          text = pathlib.Path('.github/workflows/human-velocity-diagnostics-integrate.yml').read_text()
          block = text.split('encoded = (', 1)[1].split('\n          )', 1)[0]
          chunks = [ast.literal_eval(line.strip()) for line in block.splitlines() if line.strip()]
          expected = ''
          actual = chunks[5]
          print('lengths', len(actual), len(expected))
          for tag, i1, i2, j1, j2 in difflib.SequenceMatcher(a=actual, b=expected).get_opcodes():
              if tag != 'equal':
                  print(tag, i1, i2, repr(actual[i1:i2]), j1, j2, repr(expected[j1:j2]))
          assert actual == expected
