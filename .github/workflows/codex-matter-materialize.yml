name: Materialize Matter v0.2 checkpoint

on:
  push:
    branches:
      - codex/matter-compiler-foundation
    paths:
      - .github/codex/matter-v02.ready

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: codex/matter-compiler-foundation
          fetch-depth: 1
      - name: Apply checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat .github/codex/matter-v02.part-* > /tmp/matter-v02.patch.gz.b64
          base64 --decode /tmp/matter-v02.patch.gz.b64 > /tmp/matter-v02.patch.gz
          gzip --decompress --stdout /tmp/matter-v02.patch.gz > /tmp/matter-v02.patch
          git apply --index /tmp/matter-v02.patch
          rm -f .github/codex/matter-v02.part-* .github/codex/matter-v02.ready
          rm -f .github/workflows/codex-matter-materialize.yml
          rm -f .github/workflows/codex-matter-export.yml
          git add -A
          git config user.name "Numi Matter Bot"
          git config user.email "actions@github.com"
          git commit -m "Implement sparse APIC Matter v0.2 foundation"
          git push origin HEAD:codex/matter-compiler-foundation
