name: Materialize Matter checkpoint

on:
  push:
    branches:
      - codex/matter-compiler-foundation
    paths:
      - .github/codex/matter-checkpoint.ready

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/matter-compiler-foundation
          fetch-depth: 1
      - name: Apply checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat .github/codex/matter-checkpoint.part-* > /tmp/matter-checkpoint.patch.gz.b64
          base64 --decode /tmp/matter-checkpoint.patch.gz.b64 > /tmp/matter-checkpoint.patch.gz
          gzip --decompress --stdout /tmp/matter-checkpoint.patch.gz > /tmp/matter-checkpoint.patch
          git apply --index /tmp/matter-checkpoint.patch
          rm -f .github/codex/matter-checkpoint.part-* .github/codex/matter-checkpoint.ready
          rm -f .github/workflows/codex-matter-materialize.yml
          git add -A
          git config user.name "Numi Matter Bot"
          git config user.email "actions@github.com"
          git commit -m "Stabilize mixed Matter qualification"
          git push origin HEAD:codex/matter-compiler-foundation
