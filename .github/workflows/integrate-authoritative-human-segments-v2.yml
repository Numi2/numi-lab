name: Integrate authoritative Human segmentation v2
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/integrate-authoritative-human-segments-v2.yml]
permissions:
  contents: write
concurrency:
  group: integrate-authoritative-human-segments-v2
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Numi2/numilab-human
          ref: 40a113ec2422ac367cbf0bf2778683d4f78f7eab
          path: human-inputs
          sparse-checkout: Docs/media/native-runtime-source-package-20260915
          persist-credentials: false
      - name: Apply exact segmentation and transaction-accounting patches
        shell: python
        run: |
          import base64, hashlib, pathlib, re, subprocess, zlib
          carrier = pathlib.Path('.github/workflows/integrate-segmented-human-horizon.yml').read_text()
          match = re.search(r"segmented_encoded = '([^']+)'", carrier)
          assert match is not None
          patch = zlib.decompress(base64.b64decode(match.group(1), validate=True))
          assert len(patch) == 15451
          assert hashlib.sha256(patch).hexdigest() == '1c439dbcd19f17ec3f429f77b750fe028b7f573a99ff62673536d906404389bf'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          source = pathlib.Path('apps/numilab_human_myosim_visual_probe.mm')
          text = source.read_text()
          old_capture = (
              "    const auto runAuthoritativeHorizon = [&context, &model,\n"
              "                                           &mergeStandStatus,\n"
              "                                           useSegmentedAuthoritativeHorizon](\n"
          )
          new_capture = (
              "    const auto runAuthoritativeHorizon = [&context, &model,\n"
              "                                           &mergeStandStatus,\n"
              "                                           useSegmentedAuthoritativeHorizon,\n"
              "                                           kMaximumAuthoritativeSubmissionSteps](\n"
          )
          assert text.count(old_capture) == 1
          text = text.replace(old_capture, new_capture)
          old_head = """    bool tendonBorrowedConsumerVerified = false;
    if (!tendonProgram.bindings.empty()) {
        tendonBorrowedConsumerVerified =
"""
          new_head = """    bool tendonBorrowedConsumerVerified = false;
    if (!tendonProgram.bindings.empty()) {
        const auto* borrowedTendonStatus =
            static_cast<const MRNumiHumanStandStatusGPU*>(
                acceptedTendonConsumer.statusSnapshot.contents
            );
        const std::uint32_t borrowedTendonStatusSteps =
            useSegmentedAuthoritativeHorizon
                ? ((stepCount - 1u) %
                    kMaximumAuthoritativeSubmissionSteps) + 1u
                : stepCount;
        const bool borrowedTendonStatusMatchesPublication =
            acceptedTendonConsumer.statusSnapshot != nil &&
            (!useSegmentedAuthoritativeHorizon
                ? std::memcmp(
                    acceptedTendonConsumer.statusSnapshot.contents,
                    metalResult.standStatuses.data(),
                    sizeof(MRNumiHumanStandStatusGPU)
                  ) == 0
                : borrowedTendonStatus != nullptr &&
                  borrowedTendonStatus->code == status.code &&
                  borrowedTendonStatus->environment == status.environment &&
                  borrowedTendonStatus->completedSteps ==
                    borrowedTendonStatusSteps &&
                  borrowedTendonStatus->failingIndex == status.failingIndex &&
                  borrowedTendonStatus->flags == status.flags &&
                  borrowedTendonStatus->activeContactCount ==
                    status.activeContactCount &&
                  borrowedTendonStatus->contactAndAcceleration.z ==
                    status.contactAndAcceleration.z &&
                  borrowedTendonStatus->tendonTransferCount ==
                    tendonProgram.bindings.size() *
                    borrowedTendonStatusSteps &&
                  borrowedTendonStatus->tendonEnvelopeTransferCount ==
                    tendonEnvelopeBindingCount *
                    borrowedTendonStatusSteps &&
                  borrowedTendonStatus->tendonPointTransferCount ==
                    (tendonProgram.bindings.size() -
                     tendonEnvelopeBindingCount) *
                    borrowedTendonStatusSteps &&
                  borrowedTendonStatus->tendonFailureCount == 0u);
        tendonBorrowedConsumerVerified =
"""
          assert text.count(old_head) == 1
          text = text.replace(old_head, new_head)
          old_status = """            std::memcmp(
                acceptedTendonConsumer.statusSnapshot.contents,
                metalResult.standStatuses.data(),
                sizeof(MRNumiHumanStandStatusGPU)
            ) == 0;
"""
          assert text.count(old_status) == 1
          text = text.replace(old_status,
                              "            borrowedTendonStatusMatchesPublication;\n")
          source.write_text(text)
          subprocess.run(['git','add','--',str(source)], check=True)
          assert subprocess.check_output(
              ['git','diff','--cached','--name-only'], text=True
          ).splitlines() == ['apps/numilab_human_myosim_visual_probe.mm']
          subprocess.run(['git','diff','--cached','--check'], check=True)
      - name: Verify or install Metal 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/numi-authoritative-segment-probe.metal <<'METAL'
          #include <metal_stdlib>
          using namespace metal;
          kernel void numi_authoritative_segment_probe(device float* x [[buffer(0)]]) { if (x != nullptr) x[0] = x[0]; }
          METAL
          if ! xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-authoritative-segment-probe.metal -o /tmp/numi-authoritative-segment-probe.air >/tmp/metal-initial.txt 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-authoritative-segment-probe.metal -o /tmp/numi-authoritative-segment-probe.air
      - name: Build complete Human target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authoritative-segment-v2-evidence
          git rev-parse HEAD > authoritative-segment-v2-evidence/native-parent.txt
          git -C human-inputs rev-parse HEAD > authoritative-segment-v2-evidence/input-revision.txt
          sw_vers > authoritative-segment-v2-evidence/machine.txt
          python3 tools/check_human_host_syntax.py
          cmake -S . -B BuildHuman -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF 2>&1 | tee authoritative-segment-v2-evidence/configure.txt
          cmake --build BuildHuman --target metalrobo_numilab_human_myosim_visual_probe --parallel 3 2>&1 | tee authoritative-segment-v2-evidence/build.txt
      - name: Execute source-bound 128-step segmented horizon
        shell: python
        run: |
          import hashlib, json, os, pathlib, shlex, subprocess, time
          root = pathlib.Path.cwd()
          inputs = root / 'human-inputs'
          package = inputs / 'Docs/media/native-runtime-source-package-20260915'
          receipt = json.loads((package / 'source-package-receipt-v1.json').read_text())
          payloads = {name: inputs / value['path'] for name, value in receipt['inputs'].items()}
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          for name, path in payloads.items():
              assert digest(path) == receipt['inputs'][name]['sha256'], name
          magic = payloads['support_contact'].read_bytes()[:6]
          contacts = ([2,3,4,5,6,7] if magic == b'NHCNT1' else
                      [5,6,8,10,12,14] if magic == b'NHCNT2' else None)
          if contacts is None:
              raise RuntimeError('unsupported support payload ABI')
          output = root / 'authoritative-segment-v2-evidence'
          binary = root / 'BuildHuman/bin/metalrobo_numilab_human_myosim_visual_probe'
          command = [str(binary), str(payloads['rigid']), str(payloads['muscle']),
                     str(output/'frames'), '--tendon-payload', str(payloads['tendon']),
                     '--support-contact-payload', str(payloads['support_contact']),
                     '--joint-equality-payload', str(payloads['joint_equalities'])]
          for dof, value in [(2,'0.02'),(108,'0.1'),(109,'0.1'),(110,'0.1'),
                             (122,'0.1'),(123,'0.1'),(124,'0.1')]:
              command += ['--support-stance-dof', str(dof), value]
          for contact in contacts:
              command += ['--support-stance-contact', str(contact)]
          command += ['--muscle-step-seconds','0.00005','--muscle-step-count','128',
                      '--persistent-metal-stand','--persistent-source-passive-joint-tissue',
                      '--stand-contact-iterations','64','--stand-deterministic-replay',
                      '--dimension','640','--mechanics-only']
          started = time.monotonic()
          completed = subprocess.run(
              command,
              env={**os.environ,'MTL_DEBUG_LAYER':'1','NUMI_HUMAN_EXECUTION_STAGES':'1'},
              text=True, capture_output=True, timeout=1800)
          wall = time.monotonic() - started
          stdout, stderr = output/'stdout.txt', output/'stderr.txt'
          stdout.write_text(completed.stdout)
          stderr.write_text(completed.stderr)
          if completed.returncode != 0:
              raise RuntimeError('native segmented horizon failed: ' +
                                 str(completed.returncode) + '\n' + completed.stderr)
          summaries = [line for line in completed.stdout.splitlines()
                       if line.startswith('myosim_articulated_mechanics=')]
          if len(summaries) != 1:
              raise RuntimeError('missing or ambiguous mechanics summary')
          metrics = {}
          for token in shlex.split(summaries[0]):
              if '=' in token:
                  key, value = token.split('=',1)
                  if key in metrics: raise RuntimeError('duplicate metric '+key)
                  metrics[key] = value
          expected = {
              'myosim_articulated_mechanics':'ok','core_bodies':'157',
              'compiled_stand_recruited_muscles':'416',
              'persistent_metal_horizon':'true','persistent_completed_steps':'128',
              'persistent_root_assistance':'none',
              'persistent_source_passive_joint_tissue':'true',
              'persistent_passive_joint_law':'current_state_linear_backward_euler',
              'stand_deterministic_replay':'bitwise',
              'persistent_stand_trace':'not_requested',
              'rendering_performed':'false','visual_coverage_qualified':'false',
          }
          changed = {k:(metrics.get(k),v) for k,v in expected.items()
                     if metrics.get(k) != v}
          if changed: raise RuntimeError('execution contract changed: '+repr(changed))
          stages = [line for line in completed.stdout.splitlines()
                    if line.startswith('human_execution_stage=')]
          for stage in ['native_horizon_end','deterministic_replay_end']:
              if not any(('human_execution_stage='+stage) in line and
                         'stage_step=128' in line for line in stages):
                  raise RuntimeError(stage+' did not report 128 steps')
          result = {
              'schema':'numi.human.authoritative-segmented-horizon.v2',
              'status':'partial','step_count':128,'timestep_seconds':0.00005,
              'duration_seconds':0.0064,'maximum_submission_steps':32,
              'submission_count_per_horizon':4,'deterministic_replay':True,
              'root_assistance':'none','trace_requested':False,
              'wall_seconds':wall,'metrics':metrics,
              'native_parent':(output/'native-parent.txt').read_text().strip(),
              'input_revision':(output/'input-revision.txt').read_text().strip(),
              'binary_sha256':digest(binary),'stdout_sha256':digest(stdout),
              'stderr_sha256':digest(stderr),
              'qualification':{'authoritative_horizon_completed':True,
                  'watchdog_safe_submission_bound':True,'bitwise_replay':True,
                  'borrowed_tendon_segment_accounting':True,
                  'force_convergence':False,'sustained_standing':False,
                  'physical_m4_validation':False},
              'boundary':'Hosted Apple 6.4 ms mechanics-only horizon. Segmentation, transaction accounting and deterministic replay are established; force convergence, sustained standing and physical-M4 qualification are not.'}
          (output/'receipt.json').write_text(json.dumps(result,indent=2,allow_nan=False)+'\n')
          print(json.dumps({'completed_steps':128,'wall_seconds':wall,
              'device':metrics.get('source_support_metal_device'),
              'max_free_force_acceleration':metrics.get('persistent_max_free_force_acceleration'),
              'max_constraint_velocity_delta':metrics.get('persistent_max_constraint_velocity_delta'),
              'max_published_velocity_delta':metrics.get('persistent_max_published_velocity_delta')},
              sort_keys=True))
      - name: Publish tested numerical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bound authoritative Human horizons to verified segments'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > authoritative-segment-v2-evidence/published-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoritative-human-segment-v2-evidence
          path: authoritative-segment-v2-evidence
          retention-days: 14
          if-no-files-found: warn
