name: NumiBrain physical owner state bridge
on:
  push:
    branches: [numibrain-physical-bridge-v1]
    paths:
      - '.github/workflows/numibrain-owner-state-patch.yml'
      - 'tools/apply_numibrain_owner_patch.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: numibrain-physical-bridge-v1
      - name: Patch exact physical-owner ABI
        run: python3 tools/apply_numibrain_owner_patch.py
      - name: Configure and build native library
        run: |
          cmake -S . -B build-numibrain -DCMAKE_BUILD_TYPE=Release
          cmake --build build-numibrain -j 4
      - name: Commit verified owner ABI
        run: |
          git config user.name 'NumiBrain integration bot'
          git config user.email '33553832+Numi2@users.noreply.github.com'
          git add include/metalrobo/MetalWorld.hpp include/metalrobo/c_api.h src/metal/MetalWorld.mm src/c_api.cpp
          git diff --cached --check
          git commit -m 'feat: expose exact NumiBrain physical owner state'
          git push origin HEAD:numibrain-physical-bridge-v1
