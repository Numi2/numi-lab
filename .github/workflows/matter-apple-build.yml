name: Verify integrated Matter stack on Apple

on:
  pull_request:
    branches:
      - numisolver
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'codex/matter-compiler-foundation'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Configure Apple-native build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile MetalRobo and Matter compiler
        run: cmake --build build --target metalrobo numi-matterc -j 3

      - name: Compile a coupled MPM and FEM package
        shell: bash
        run: |
          set -euo pipefail
          matterc="$(find build -type f -name numi-matterc -perm -111 | head -n 1)"
          test -n "$matterc"
          "$matterc" \
            --material matter/materials/silicone.nmatter \
            --output /tmp/silicone.nmatterpack \
            --generated-metal /tmp/silicone.metal \
            --mode both \
            --envs 8
          test -s /tmp/silicone.nmatterpack
          test -s /tmp/silicone.metal
