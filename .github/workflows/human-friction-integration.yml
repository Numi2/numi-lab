name: Register verified Human friction build ownership
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/human-friction-integration.yml]
permissions:
  contents: write
concurrency:
  group: human-friction-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bind the verified friction owner to the native build
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','hash-object','src/metal/NumiHumanStand.metal'],text=True).strip() == '2d5ab81e812f623db7035980e62bf78a186a5434'
          p=Path('CMakeLists.txt')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '7ab2f4cb0bd19794aeb95c76a1cb54d2f9017c1e'
          s=p.read_text()
          anchor='        "${CMAKE_CURRENT_SOURCE_DIR}/include/metalrobo/numi_human_constraint_projection.h"'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'\n        "${CMAKE_CURRENT_SOURCE_DIR}/include/metalrobo/numi_human_friction.h"')
          anchor='    add_executable(metalrobo_mujoco_muscle_path_batch_test tests/mujoco_muscle_path_batch_test.cpp)'
          assert s.count(anchor)==1
          addition='''    add_executable(metalrobo_numi_human_friction_test tests/numi_human_friction_test.cpp)
              target_include_directories(metalrobo_numi_human_friction_test PRIVATE include)
              target_compile_options(metalrobo_numi_human_friction_test PRIVATE -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off)
              set_target_properties(metalrobo_numi_human_friction_test PROPERTIES RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/bin")
              add_test(NAME numi_human_friction COMMAND metalrobo_numi_human_friction_test)
              set_tests_properties(numi_human_friction PROPERTIES LABELS "numi-human;mechanics;contact")
          '''
          s=s.replace(anchor,addition+anchor)
          p.write_text(s)
          subprocess.run(['git','diff','--check'],check=True)
      - name: Exercise the registered target
        run: |
          set -eu
          cmake -S . -B BuildHuman -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build BuildHuman --target metalrobo_numi_human_friction_test --parallel 3
          ctest --test-dir BuildHuman -R '^numi_human_friction$' --output-on-failure
      - name: Publish the verified CMake change only
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = human-native-runtime-20260915
          git add -- CMakeLists.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind Human friction helper to shader rebuilds and CTest'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
