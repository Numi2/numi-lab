name: Verify Human full-equality limit response
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/integrate-human-conditioned-limits.yml]
permissions:
  contents: write
concurrency:
  group: human-conditioned-limit-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve baseline and apply exact scoped changes
        run: |
          set -euo pipefail
          mkdir -p /tmp/human-limit-baseline human-limit-evidence
          git rev-parse HEAD > human-limit-evidence/baseline-revision.txt
          git archive HEAD include src/metal/NumiHumanStand.metal | tar -x -C /tmp/human-limit-baseline
          python3 tools/patch_human_conditioned_limits.py
          git diff --check
      - name: Verify portable policies and production host compilation
        run: |
          set -eu
          for name in constraint_projection equality_limit_block passive_joint friction bilateral; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/numi_human_${name}_test.cpp -o /tmp/human-${name}
            /tmp/human-${name}
          done
          python3 tools/check_human_constraint_owner.py
          python3 tools/check_human_host_syntax.py
      - name: Reproduce the old coupled-limit error on the actual GPU
        run: |
          set -eu
          old=/tmp/human-limit-baseline
          xcrun --sdk macosx metal -std=metal4.0 -fno-fast-math -I"$old/include" -c "$old/src/metal/NumiHumanStand.metal" -o /tmp/old-limit.air
          xcrun --sdk macosx metallib /tmp/old-limit.air -o /tmp/old-limit.metallib
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-fast-math -fobjc-arc -I"$old/include" tests/numi_human_bilateral_metal_test.mm -framework Foundation -framework Metal -o /tmp/old-limit-test
          set +e
          MTL_DEBUG_LAYER=1 /tmp/old-limit-test /tmp/old-limit.metallib > human-limit-evidence/baseline-stdout.txt 2> human-limit-evidence/baseline-stderr.txt
          code=$?
          set -e
          cat human-limit-evidence/baseline-stdout.txt human-limit-evidence/baseline-stderr.txt
          printf '%s\n' "$code" > human-limit-evidence/baseline-exit.txt
          test "$code" = 1
          grep -q 'coupled equality velocity differs from reduced-mass oracle' human-limit-evidence/baseline-stderr.txt
      - name: Exercise corrected production kernel with unchanged tolerances
        run: |
          set -eu
          xcrun --sdk macosx metal -std=metal4.0 -fno-fast-math -Iinclude -c src/metal/NumiHumanStand.metal -o /tmp/new-limit.air
          xcrun --sdk macosx metallib /tmp/new-limit.air -o /tmp/new-limit.metallib
          for name in passive friction bilateral; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-fast-math -fobjc-arc -Iinclude tests/numi_human_${name}_metal_test.mm -framework Foundation -framework Metal -o /tmp/new-${name}-test
            MTL_DEBUG_LAYER=1 /tmp/new-${name}-test /tmp/new-limit.metallib > human-limit-evidence/${name}-stdout.txt 2> human-limit-evidence/${name}-stderr.txt
            cat human-limit-evidence/${name}-stdout.txt human-limit-evidence/${name}-stderr.txt
          done
      - name: Publish only the verified numerical source
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = human-native-runtime-20260915
          git add -- include/metalrobo/numi_human_stand_gpu.h src/metal/MetalArticulatedOperator.mm src/metal/NumiHumanStand.metal tests/numi_human_bilateral_metal_test.mm tools/check_human_constraint_owner.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Condition Human joint-limit responses on the complete bilateral system'
          branch="human-conditioned-limits-verified-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          printf '%s\n' "$branch" > human-limit-evidence/source-branch.txt
          git rev-parse HEAD > human-limit-evidence/source-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-conditioned-limit-results
          path: human-limit-evidence
          retention-days: 14
          if-no-files-found: error
