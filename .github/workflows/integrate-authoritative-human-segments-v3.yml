name: Integrate authoritative Human segmentation v3
on:
  push:
    branches: [human-native-runtime-20260915]
    paths:
      - .github/workflows/integrate-authoritative-human-segments-v3.yml
      - tools/integrate_authoritative_human_segments.py
permissions:
  contents: write
concurrency:
  group: integrate-authoritative-human-segments-v3
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Numi2/numilab-human
          ref: 40a113ec2422ac367cbf0bf2778683d4f78f7eab
          path: human-inputs
          sparse-checkout: Docs/media/native-runtime-source-package-20260915
          persist-credentials: false
      - name: Apply reviewed numerical source increment
        run: python3 tools/integrate_authoritative_human_segments.py prepare
      - name: Verify or install Metal 4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '#include <metal_stdlib>' 'using namespace metal;' 'kernel void numi_segment_probe(device float* x [[buffer(0)]]) { if (x != nullptr) x[0] = x[0]; }' > /tmp/numi-segment-probe.metal
          if ! xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-segment-probe.metal -o /tmp/numi-segment-probe.air >/tmp/metal-initial.txt 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-segment-probe.metal -o /tmp/numi-segment-probe.air
      - name: Build complete Human target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authoritative-segment-v3-evidence
          git rev-parse HEAD > authoritative-segment-v3-evidence/native-parent.txt
          git -C human-inputs rev-parse HEAD > authoritative-segment-v3-evidence/input-revision.txt
          sw_vers > authoritative-segment-v3-evidence/machine.txt
          python3 tools/check_human_host_syntax.py
          cmake -S . -B BuildHuman -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF 2>&1 | tee authoritative-segment-v3-evidence/configure.txt
          cmake --build BuildHuman --target metalrobo_numilab_human_myosim_visual_probe --parallel 3 2>&1 | tee authoritative-segment-v3-evidence/build.txt
      - name: Execute source-bound 128-step segmented horizon
        run: >-
          python3 tools/integrate_authoritative_human_segments.py execute
          --inputs human-inputs
          --build BuildHuman
          --output authoritative-segment-v3-evidence
      - name: Publish tested numerical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bound authoritative Human horizons to verified segments'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > authoritative-segment-v3-evidence/published-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoritative-human-segment-v3-evidence
          path: authoritative-segment-v3-evidence
          retention-days: 14
          if-no-files-found: warn
