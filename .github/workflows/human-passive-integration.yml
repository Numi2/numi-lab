name: Integrate Human passive joints
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/human-passive-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-bound passive-law change
        shell: python
        run: |
          import base64, hashlib, subprocess, zlib
          data = zlib.decompress(base64.b64decode(''))
          assert len(data) == 46177
          assert hashlib.sha256(data).hexdigest() == '8b32d4e610fd888a6c5a1c915e6e838625c34793b741208ad64b14f90f420323'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','--index','-'],input=data,check=True)
      - name: Verify portable numerical policies
        run: |
          for name in constraint_projection equality_limit_block passive_joint; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/numi_human_${name}_test.cpp -o /tmp/human-${name}
            /tmp/human-${name}
          done
          python3 tools/check_human_constraint_owner.py
          git diff --cached --check
      - name: Compile production shader and host owners
        run: |
          xcrun --sdk macosx metal -std=metal3.1 -Iinclude -c src/metal/NumiHumanStand.metal -o /tmp/NumiHumanStand.air
          clang++ -std=c++20 -fobjc-arc -fsyntax-only -Iinclude -Imatter/include src/metal/MetalArticulatedOperator.mm
          clang++ -std=c++20 -fobjc-arc -fsyntax-only -Iinclude -Imatter/include apps/numilab_human_myosim_visual_probe.mm
      - name: Publish tested source and retire integration workflow
        run: |
          test "$GITHUB_REF_NAME" = human-native-runtime-20260915
          git rm -- .github/workflows/human-passive-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use current-state passive joints in the implicit Human solve'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > human-source-revision.txt
          git archive --format=tar HEAD include src apps tests tools .github CMakeLists.txt | gzip > human-native-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: human-passive-native-source
          path: |
            human-native-source.tar.gz
            human-source-revision.txt
          retention-days: 14
          if-no-files-found: error
