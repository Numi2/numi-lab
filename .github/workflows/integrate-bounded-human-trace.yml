name: Integrate bounded Human trace sampling
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/integrate-bounded-human-trace.yml]
permissions:
  contents: write
concurrency:
  group: integrate-bounded-human-trace
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Numi2/numilab-human
          ref: bbf07157d6cc57265cfa401b8f1fafeeec61b3c9
          path: human-inputs
          sparse-checkout: |
            .numi/commands
            Docs/media/native-runtime-source-package-20260915
          persist-credentials: false
      - name: Apply exact bounded-trace source patch
        shell: python
        run: |
          import base64, hashlib, subprocess, zlib
          encoded = ''
          compressed = base64.b64decode(encoded, validate=True)
          patch = zlib.decompress(compressed)
          assert len(patch) == 11134
          assert hashlib.sha256(patch).hexdigest() == 'f9a48d7747a61f5b45ac5a0e78599215702943211c2e2976548864df88b01c49'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines() == ['apps/numilab_human_myosim_visual_probe.mm']
          subprocess.run(['git','diff','--cached','--check'],check=True)
      - name: Verify or install Metal compiler
        run: |
          set -euo pipefail
          cat > /tmp/numi-trace-probe.metal <<'METAL'
          #include <metal_stdlib>
          using namespace metal;
          kernel void numi_trace_probe(device float* x [[buffer(0)]]) { if (x != nullptr) x[0] = x[0]; }
          METAL
          if ! xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-trace-probe.metal -o /tmp/numi-trace-probe.air >/tmp/metal-initial.txt 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-trace-probe.metal -o /tmp/numi-trace-probe.air
      - name: Build complete Human target
        run: |
          python3 tools/check_human_host_syntax.py
          cmake -S . -B BuildHuman -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build BuildHuman --target metalrobo_numilab_human_myosim_visual_probe --parallel 3
      - name: Execute 128-step source-bound trace
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root=pathlib.Path.cwd(); inputs=root/'human-inputs'
          receipt=json.loads((inputs/'Docs/media/native-runtime-source-package-20260915/source-package-receipt-v1.json').read_text())
          payloads={name:inputs/value['path'] for name,value in receipt['inputs'].items()}
          output=root/'bounded-trace-evidence'; output.mkdir()
          command=[str(inputs/'.numi/commands/human'),'stand',str(payloads['rigid'].parent),
              str(output/'unused.nhbones'),str(payloads['tendon']),str(payloads['support_contact']),
              str(output/'frames'),'--mechanics-only','--steps','128','--timestep','0.00005']
          environment={**os.environ,'NUMI_LAB_ROOT':str(root),'NUMI_BUILD_DIR':str(root/'BuildHuman'),'MTL_DEBUG_LAYER':'1'}
          completed=subprocess.run(command,env=environment,text=True,capture_output=True,timeout=1200)
          (output/'stdout.txt').write_text(completed.stdout)
          (output/'stderr.txt').write_text(completed.stderr)
          if completed.returncode != 0: raise RuntimeError('bounded trace execution failed')
          rows=[line.split('=',1)[1] for line in completed.stdout.splitlines() if line.startswith('persistent_stand_trace=')]
          if len(rows)!=1: raise RuntimeError('missing or ambiguous trace')
          trace=json.loads(rows[0])
          assert trace['schema']=='numi.human.persistent-stand-trace.v5'
          assert trace['driver']=='bounded_segment_production_horizon'
          assert trace['maximum_segment_steps']==2
          assert trace['sample_count']==65==len(trace['samples'])
          assert trace['endpoint_equivalent']=='bitwise'
          assert trace['endpoint_max_q_delta']==0 and trace['endpoint_max_v_delta']==0
          assert trace['samples'][0]['step']==0 and trace['samples'][0]['segment_steps']==0
          assert [row['step'] for row in trace['samples'][1:]]==list(range(2,129,2))
          assert all(row['segment_steps']==2 for row in trace['samples'][1:])
          assert all('active_contact_count' in row and 'maximum_active_contact_count' in row for row in trace['samples'])
          summary=[line for line in completed.stdout.splitlines() if line.startswith('myosim_articulated_mechanics=')]
          assert len(summary)==1 and 'persistent_completed_steps=128' in summary[0]
          (output/'receipt.json').write_text(json.dumps({'schema':'numi.human.bounded-trace-integration.v1','native_source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'trace_samples':len(trace['samples']),'maximum_segment_steps':trace['maximum_segment_steps'],'endpoint_equivalent':trace['endpoint_equivalent'],'qualification_boundary':'Trace sampling and deterministic endpoint only; not standing or force convergence.'},indent=2)+'\n')
      - name: Publish tested source increment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bound Human trace sampling to 64 production intervals'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > bounded-trace-evidence/source-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-bounded-trace-evidence
          path: bounded-trace-evidence
          retention-days: 14
          if-no-files-found: warn
