name: Materialize Matter integration

on:
  pull_request:
    branches:
      - numisolver
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'codex/matter-compiler-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check patch payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for part in 00 01 02 03 04 05 06; do
            test -s ".github/matter-patch/part-${part}.b64" || ready=false
          done
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Apply and publish integrated Matter stack
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/matter-patch/part-*.b64 \
            | base64 --decode \
            | gzip -dc > /tmp/numi-matter-integration.patch
          printf '%s  %s\n' \
            '8b319531a0b69eb6e6a1aa71d7aa4199de95d1112e6ab54be04b42bfb41e4b79' \
            /tmp/numi-matter-integration.patch \
            | sha256sum --check --strict
          git apply --check /tmp/numi-matter-integration.patch
          git apply --index /tmp/numi-matter-integration.patch
          git rm -r .github/matter-patch
          git rm .github/workflows/matter-source-export.yml
          git config user.name 'Numi Matter Compiler'
          git config user.email 'numi-matter@users.noreply.github.com'
          git commit -m 'Integrate the Numi Matter multiphysics compiler and runtime'
          git push origin HEAD:codex/matter-compiler-foundation
