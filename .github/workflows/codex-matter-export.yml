name: Materialize lazy rod CCD and coupling fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: matter-lazy-rod-ccd
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/matter-compiler-foundation'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact branch history
        uses: actions/checkout@v4
        with:
          ref: codex/matter-compiler-foundation
          fetch-depth: 0

      - name: Correct, qualify, and publish
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_one(source: str, old: str, new: str, role: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{role}: expected one match, found {count}")
              return source.replace(old, new, 1)

          def sub_one(source: str, pattern: str, replacement: str, role: str) -> str:
              result, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{role}: expected one match, found {count}")
              return result

          metal_path = Path("src/metal/MetalWorld.mm")
          source = metal_path.read_text()
          generalized = "MetalWorldDiagnostics ensureGeneralizedConstraintPipeline(\n"
          helper = '''MetalWorldDiagnostics ensureRodCCDPipeline(
              detail::MetalWorldContextState& context,
              const bool hasRods,
              MetalWorldDiagnostics diagnostics
          ) {
              if (!hasRods || context.rodCCDPipeline != nil) {
                  return diagnostics;
              }
              NSError* error = nil;
              id<MTLComputePipelineState> pipeline = makePipeline(
                  context.device,
                  context.library,
                  @"mr_world_resolve_rod_ccd",
                  &error
              );
              if (pipeline == nil) {
                  return reject(
                      std::move(diagnostics),
                      MetalWorldHostStatus::metalPipelineFailure,
                      "failed to create optional rod-CCD pipeline: " +
                          describeError(error)
                  );
              }
              if (pipeline.maxTotalThreadsPerThreadgroup == 0u ||
                  pipeline.staticThreadgroupMemoryLength >
                      context.device.maxThreadgroupMemoryLength) {
                  return reject(
                      std::move(diagnostics),
                      MetalWorldHostStatus::metalDeviceUnsupported,
                      "device cannot execute the rod-CCD kernel geometry"
                  );
              }
              context.rodCCDPipeline = pipeline;
              ++context.stats.pipelineCreationCount;
              return diagnostics;
          }

          '''
          source = replace_one(
              source,
              generalized,
              helper + generalized,
              "rod-CCD helper insertion",
          )
          source = sub_one(
              source,
              r'^    __strong id<MTLComputePipelineState> rodCCD = nil;\n',
              '',
              "rod-CCD eager declaration",
          )
          source = sub_one(
              source,
              r'^    rodCCD = createContactPipeline\(\n'
              r'        @"mr_world_resolve_rod_ccd"\n'
              r'    \);\n',
              '',
              "rod-CCD eager creation",
          )
          source = sub_one(
              source,
              r'^        rodCCD == nil \|\|\n',
              '',
              "rod-CCD eager requirement",
          )
          source = replace_one(
              source,
              "    context.rodCCDPipeline = rodCCD;\n",
              "    context.rodCCDPipeline = nil;\n",
              "rod-CCD context publication",
          )
          source = replace_one(
              source,
              "    context.stats.pipelineCreationCount += 83u;\n",
              "    context.stats.pipelineCreationCount += 82u;\n",
              "eager pipeline count",
          )
          initialization = '''            diagnostics = initializeContext(
                          *selectedState,
                          std::move(diagnostics)
                      );
                      if (!diagnostics.succeeded()) {
                          return diagnostics;
                      }
          '''
          ensure = '''            diagnostics = ensureRodCCDPipeline(
                          *selectedState,
                          world.rodCount() != 0u,
                          std::move(diagnostics)
                      );
                      if (!diagnostics.succeeded()) {
                          return diagnostics;
                      }
          '''
          source = replace_one(
              source,
              initialization,
              initialization + ensure,
              "rod-CCD lazy call site",
          )
          metal_path.write_text(source)

          probe_path = Path("apps/matter_physics_probe.mm")
          probe = probe_path.read_text()
          probe_helper = '''MRBodyStateGPU staticSceneBody() {
              MRBodyStateGPU state{};
              state.position.w = 1.0f;
              state.orientation.w = 1.0f;
              state.flagsAndIndices[0] = MR_MOTION_STATIC;
              state.flagsAndIndices[1] = MR_INVALID_INDEX;
              state.flagsAndIndices[2] = 0u;
              return state;
          }

          '''
          probe = replace_one(
              probe,
              probe_helper,
              '',
              "unused scene-body helper",
          )
          probe = replace_one(
              probe,
              "        const std::array<MRBodyStateGPU, 1u> scene{staticSceneBody()};\n",
              '',
              "invalid coupling scene record",
          )
          probe = replace_one(
              probe,
              "            .efforts = efforts,\n            .initialSceneBodies = scene,\n",
              "            .efforts = efforts,\n",
              "coupling batch scene binding",
          )
          probe_path.write_text(probe)
          PY

          git diff --check
          cmake -S . -B build-matter-lazy-rod \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build build-matter-lazy-rod \
            --target metalrobo_matter_physics_probe \
            -j 3
          build-matter-lazy-rod/bin/metalrobo_matter_physics_probe \
            --metal-world-coupling

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/metal/MetalWorld.mm apps/matter_physics_probe.mm
          git commit -m "Lazily initialize rod CCD for Matter coupling"
          git push \
            --force-with-lease=refs/heads/codex/matter-compiler-foundation:${EXPECTED_HEAD} \
            origin HEAD:codex/matter-compiler-foundation
