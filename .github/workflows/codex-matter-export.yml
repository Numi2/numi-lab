name: Diagnose standalone rod Metal pipeline

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: matter-rod-pipeline-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'codex/matter-compiler-foundation'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Apply audited lazy-rod patch and add exact diagnostics
        shell: bash
        env:
          PAYLOAD_SHA256: d1784e676308a305878951b6d2382b0e362e2ffe28f0f4d455120a17be7efafb
          PATCH_SHA256: 84d26238e070558d1127a59d66112193b80bcbd2a353ce69537ab4235d4a9893
        run: |
          set -euo pipefail
          echo "${PAYLOAD_SHA256}  .github/matter-full-lazy-rods.patch.gz.b64" \
            | shasum -a 256 --check
          base64 -D \
            -i .github/matter-full-lazy-rods.patch.gz.b64 \
            -o /tmp/matter-full-lazy-rods.patch.gz
          gzip -dc /tmp/matter-full-lazy-rods.patch.gz \
            > /tmp/matter-full-lazy-rods.patch
          echo "${PATCH_SHA256}  /tmp/matter-full-lazy-rods.patch" \
            | shasum -a 256 --check
          git apply --check /tmp/matter-full-lazy-rods.patch
          git apply /tmp/matter-full-lazy-rods.patch

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/metal/MetalDiscreteElasticRod.mm")
          source = path.read_text()
          old = '''        error = nil;
                  id<MTLComputePipelineState> pipeline = [device
                      newComputePipelineStateWithFunction:function
                                                     error:&error];
                  id<MTLComputePipelineState> resolvePipeline = [device
                      newComputePipelineStateWithFunction:resolveFunction
                                                     error:&error];
                  id<MTLComputePipelineState> applyPipeline = [device
                      newComputePipelineStateWithFunction:applyFunction
                                                     error:&error];
                  id<MTLComputePipelineState> toolNarrowphasePipeline =
                      toolPairs.empty()
                      ? nil
                      : [device
                          newComputePipelineStateWithFunction:
                              toolNarrowphaseFunction
                          error:&error];
                  id<MTLComputePipelineState> toolSolvePipeline =
                      toolPairs.empty()
                      ? nil
                      : [device
                          newComputePipelineStateWithFunction:
                              toolSolveFunction
                          error:&error];
                  if (pipeline == nil ||
                      resolvePipeline == nil ||
                      applyPipeline == nil ||
                      (!toolPairs.empty() &&
                       (
                           toolNarrowphasePipeline == nil ||
                           toolSolvePipeline == nil
                       ))) {
                      return reject(
                          std::move(diagnostics),
                          MetalDiscreteElasticRodHostStatus::
                              metalPipelineFailure,
                          "failed to create rod pipeline: " +
                              errorString(error)
                      );
                  }
          '''
          new = '''        std::string failedPipeline;
                  std::string pipelineError;
                  const auto createPipeline = [&amp;](
                      id<MTLFunction> candidate,
                      const char* name
                  ) -> id<MTLComputePipelineState> {
                      NSError* candidateError = nil;
                      id<MTLComputePipelineState> result = [device
                          newComputePipelineStateWithFunction:candidate
                                                         error:&candidateError];
                      if (result == nil && failedPipeline.empty()) {
                          failedPipeline = name;
                          pipelineError = errorString(candidateError);
                      }
                      return result;
                  };
                  id<MTLComputePipelineState> pipeline = createPipeline(
                      function,
                      "mr_discrete_elastic_rod_step"
                  );
                  id<MTLComputePipelineState> resolvePipeline = createPipeline(
                      resolveFunction,
                      "mr_resolve_rod_rigid_attachments"
                  );
                  id<MTLComputePipelineState> applyPipeline = createPipeline(
                      applyFunction,
                      "mr_apply_rod_rigid_reactions"
                  );
                  id<MTLComputePipelineState> toolNarrowphasePipeline =
                      toolPairs.empty()
                      ? nil
                      : createPipeline(
                          toolNarrowphaseFunction,
                          "mr_rod_tool_narrowphase"
                      );
                  id<MTLComputePipelineState> toolSolvePipeline =
                      toolPairs.empty()
                      ? nil
                      : createPipeline(
                          toolSolveFunction,
                          "mr_solve_rod_tool_contacts"
                      );
                  if (!failedPipeline.empty()) {
                      return reject(
                          std::move(diagnostics),
                          MetalDiscreteElasticRodHostStatus::
                              metalPipelineFailure,
                          "failed to create rod pipeline '" +
                              failedPipeline + "': " + pipelineError
                      );
                  }
          '''.replace('&amp;', '&')
          if source.count(old) != 1:
              raise SystemExit(f"rod diagnostic source mismatch: {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          cmake -S . -B build-rod-diagnostic \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build build-rod-diagnostic \
            --target metalrobo_metal_discrete_elastic_rod_probe \
            -j 3
          build-rod-diagnostic/bin/metalrobo_metal_discrete_elastic_rod_probe
