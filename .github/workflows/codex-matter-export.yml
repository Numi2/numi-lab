name: Materialize complete lazy rod pipelines

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: matter-complete-lazy-rods
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/matter-compiler-foundation'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out exact branch history
        uses: actions/checkout@v4
        with:
          ref: codex/matter-compiler-foundation
          fetch-depth: 0

      - name: Apply, qualify, and publish
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PAYLOAD_SHA256: d1784e676308a305878951b6d2382b0e362e2ffe28f0f4d455120a17be7efafb
          PATCH_SHA256: 84d26238e070558d1127a59d66112193b80bcbd2a353ce69537ab4235d4a9893
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

          echo "${PAYLOAD_SHA256}  .github/matter-full-lazy-rods.patch.gz.b64" \
            | shasum -a 256 --check
          base64 -D \
            -i .github/matter-full-lazy-rods.patch.gz.b64 \
            -o /tmp/matter-full-lazy-rods.patch.gz
          gzip -dc /tmp/matter-full-lazy-rods.patch.gz \
            > /tmp/matter-full-lazy-rods.patch
          echo "${PATCH_SHA256}  /tmp/matter-full-lazy-rods.patch" \
            | shasum -a 256 --check

          git apply --check /tmp/matter-full-lazy-rods.patch
          git apply /tmp/matter-full-lazy-rods.patch
          git diff --check

          cmake -S . -B build-matter-complete-lazy-rods \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build build-matter-complete-lazy-rods \
            --target \
              metalrobo_matter_physics_probe \
              metalrobo_metal_discrete_elastic_rod_probe \
            -j 3

          build-matter-complete-lazy-rods/bin/metalrobo_matter_physics_probe \
            --metal-world-coupling
          build-matter-complete-lazy-rods/bin/metalrobo_metal_discrete_elastic_rod_probe

          rm .github/matter-full-lazy-rods.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/metal/MetalWorld.mm \
            apps/matter_physics_probe.mm \
            .github/matter-full-lazy-rods.patch.gz.b64
          git commit -m "Lazily initialize optional rod pipelines"
          git push \
            --force-with-lease=refs/heads/codex/matter-compiler-foundation:${EXPECTED_HEAD} \
            origin HEAD:codex/matter-compiler-foundation
