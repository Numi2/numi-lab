name: Materialize lazy rod CCD and coupling fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: matter-lazy-rod-ccd
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/matter-compiler-foundation'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact branch history
        uses: actions/checkout@v4
        with:
          ref: codex/matter-compiler-foundation
          fetch-depth: 0

      - name: Correct, qualify, and publish
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

          python3 - <<'PY'
          from pathlib import Path

          metal_path = Path("src/metal/MetalWorld.mm")
          source = metal_path.read_text()

          generalized = "MetalWorldDiagnostics ensureGeneralizedConstraintPipeline(\n"
          helper = '''MetalWorldDiagnostics ensureRodCCDPipeline(
              detail::MetalWorldContextState& context,
              const bool hasRods,
              MetalWorldDiagnostics diagnostics
          ) {
              if (!hasRods || context.rodCCDPipeline != nil) {
                  return diagnostics;
              }
              NSError* error = nil;
              id<MTLComputePipelineState> pipeline = makePipeline(
                  context.device,
                  context.library,
                  @"mr_world_resolve_rod_ccd",
                  &error
              );
              if (pipeline == nil) {
                  return reject(
                      std::move(diagnostics),
                      MetalWorldHostStatus::metalPipelineFailure,
                      "failed to create optional rod-CCD pipeline: " +
                          describeError(error)
                  );
              }
              if (pipeline.maxTotalThreadsPerThreadgroup == 0u ||
                  pipeline.staticThreadgroupMemoryLength >
                      context.device.maxThreadgroupMemoryLength) {
                  return reject(
                      std::move(diagnostics),
                      MetalWorldHostStatus::metalDeviceUnsupported,
                      "device cannot execute the rod-CCD kernel geometry"
                  );
              }
              context.rodCCDPipeline = pipeline;
              ++context.stats.pipelineCreationCount;
              return diagnostics;
          }

          '''
          declaration = "    __strong id<MTLComputePipelineState> rodCCD = nil;\n"
          eager = '''    rodCCD = createContactPipeline(
              @"mr_world_resolve_rod_ccd"
          );
          '''
          required = "        rodCCD == nil ||\n"
          assignment = "    context.rodCCDPipeline = rodCCD;\n"
          count = "    context.stats.pipelineCreationCount += 83u;\n"
          initialization = '''            diagnostics = initializeContext(
                          *selectedState,
                          std::move(diagnostics)
                      );
                      if (!diagnostics.succeeded()) {
                          return diagnostics;
                      }
                      diagnostics = ensureBufferArena(
          '''
          initialization_replacement = '''            diagnostics = initializeContext(
                          *selectedState,
                          std::move(diagnostics)
                      );
                      if (!diagnostics.succeeded()) {
                          return diagnostics;
                      }
                      diagnostics = ensureRodCCDPipeline(
                          *selectedState,
                          world.rodCount() != 0u,
                          std::move(diagnostics)
                      );
                      if (!diagnostics.succeeded()) {
                          return diagnostics;
                      }
                      diagnostics = ensureBufferArena(
          '''
          checks = {
              generalized: 1,
              declaration: 1,
              eager: 1,
              required: 1,
              assignment: 1,
              count: 1,
              initialization: 1,
          }
          for text, expected in checks.items():
              actual = source.count(text)
              if actual != expected:
                  raise SystemExit(
                      f"MetalWorld source no longer matches audited lazy-rod edit: "
                      f"expected {expected}, found {actual}: {text[:80]!r}"
                  )
          source = source.replace(generalized, helper + generalized, 1)
          source = source.replace(declaration, "", 1)
          source = source.replace(eager, "", 1)
          source = source.replace(required, "", 1)
          source = source.replace(
              assignment,
              "    context.rodCCDPipeline = nil;\n",
              1,
          )
          source = source.replace(
              count,
              "    context.stats.pipelineCreationCount += 82u;\n",
              1,
          )
          source = source.replace(
              initialization,
              initialization_replacement,
              1,
          )
          metal_path.write_text(source)

          probe_path = Path("apps/matter_physics_probe.mm")
          probe = probe_path.read_text()
          probe_helper = '''MRBodyStateGPU staticSceneBody() {
              MRBodyStateGPU state{};
              state.position.w = 1.0f;
              state.orientation.w = 1.0f;
              state.flagsAndIndices[0] = MR_MOTION_STATIC;
              state.flagsAndIndices[1] = MR_INVALID_INDEX;
              state.flagsAndIndices[2] = 0u;
              return state;
          }

          '''
          scene = "        const std::array<MRBodyStateGPU, 1u> scene{staticSceneBody()};\n"
          field = (
              "            .efforts = efforts,\n"
              "            .initialSceneBodies = scene,\n"
          )
          for text in (probe_helper, scene, field):
              if probe.count(text) != 1:
                  raise SystemExit(
                      "coupling probe source no longer matches the audited layout edit"
                  )
          probe = probe.replace(probe_helper, "", 1)
          probe = probe.replace(scene, "", 1)
          probe = probe.replace(field, "            .efforts = efforts,\n", 1)
          probe_path.write_text(probe)
          PY

          git diff --check
          cmake -S . -B build-matter-lazy-rod \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build build-matter-lazy-rod \
            --target metalrobo_matter_physics_probe \
            -j 3
          build-matter-lazy-rod/bin/metalrobo_matter_physics_probe \
            --metal-world-coupling

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/metal/MetalWorld.mm apps/matter_physics_probe.mm
          git commit -m "Lazily initialize rod CCD for Matter coupling"
          git push \
            --force-with-lease=refs/heads/codex/matter-compiler-foundation:${EXPECTED_HEAD} \
            origin HEAD:codex/matter-compiler-foundation
