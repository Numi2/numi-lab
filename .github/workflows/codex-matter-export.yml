name: Materialize Matter coupling harness fix

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: matter-coupling-harness-fix
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'codex/matter-compiler-foundation'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact branch history
        uses: actions/checkout@v4
        with:
          ref: codex/matter-compiler-foundation
          fetch-depth: 0

      - name: Correct, qualify, and publish the coupling harness
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/matter_physics_probe.mm")
          source = path.read_text()
          helper = '''MRBodyStateGPU staticSceneBody() {
              MRBodyStateGPU state{};
              state.position.w = 1.0f;
              state.orientation.w = 1.0f;
              state.flagsAndIndices[0] = MR_MOTION_STATIC;
              state.flagsAndIndices[1] = MR_INVALID_INDEX;
              state.flagsAndIndices[2] = 0u;
              return state;
          }

          '''
          scene = "        const std::array<MRBodyStateGPU, 1u> scene{staticSceneBody()};\n"
          field = (
              "            .efforts = efforts,\n"
              "            .initialSceneBodies = scene,\n"
          )
          if source.count(helper) != 1 or source.count(scene) != 1 or source.count(field) != 1:
              raise SystemExit("coupling harness source no longer matches the audited edit")
          source = source.replace(helper, "", 1)
          source = source.replace(scene, "", 1)
          source = source.replace(field, "            .efforts = efforts,\n", 1)
          path.write_text(source)
          PY

          git diff --check
          cmake -S . -B build-matter-coupling-fix \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build build-matter-coupling-fix \
            --target metalrobo_matter_physics_probe \
            -j 3
          build-matter-coupling-fix/bin/metalrobo_matter_physics_probe \
            --metal-world-coupling

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/matter_physics_probe.mm
          git commit -m "Fix the articulated Matter coupling probe layout"
          git push \
            --force-with-lease=refs/heads/codex/matter-compiler-foundation:${EXPECTED_HEAD} \
            origin HEAD:codex/matter-compiler-foundation
