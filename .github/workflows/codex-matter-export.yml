name: Export exact Matter audit staging

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'codex/matter-compiler-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Package audit staging
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/numi-matter-audit-staging.tar.gz \
            .github/matter-audit-improve* \
            .github/workflows/codex-matter-export.yml
      - name: Upload audit staging
        uses: actions/upload-artifact@v4
        with:
          name: numi-matter-audit-staging-${{ github.event.pull_request.head.sha }}
          path: /tmp/numi-matter-audit-staging.tar.gz
          retention-days: 1
          if-no-files-found: error
