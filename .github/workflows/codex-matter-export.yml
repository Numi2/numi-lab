name: Materialize audited Matter improvements

on:
  push:
    branches: [codex/matter-compiler-foundation]
    paths:
      - .github/workflows/codex-matter-export.yml

permissions:
  contents: write

concurrency:
  group: matter-audit-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch history
        uses: actions/checkout@v4
        with:
          ref: codex/matter-compiler-foundation
          fetch-depth: 0

      - name: Apply, audit, and publish
        shell: bash
        env:
          BASE_SHA: 01d171fab09a4f693fd231fd44d0e2b4c278b418
          PATCH_SHA256: 42c3ca28683a394e42a1857cd8f57f2c33551a1f19fc08e15080a6cb17b69c02
        run: |
          set -euo pipefail

          base64 --decode .github/matter-audit-improve.patch.gz.b64 \
            | gzip -d > /tmp/matter-audit-improve.patch
          echo "${PATCH_SHA256}  /tmp/matter-audit-improve.patch" \
            | sha256sum --check -

          git diff --quiet "${BASE_SHA}" -- \
            CMakeLists.txt \
            apps/matter_physics_probe.mm \
            include/metalrobo/MetalWorld.hpp \
            matter \
            src/metal/MetalWorld.mm

          git apply --check /tmp/matter-audit-improve.patch
          git apply /tmp/matter-audit-improve.patch
          rm .github/matter-audit-improve.patch.gz.b64
          git diff --check

          cmake -S matter -B /tmp/numi-matter-audit-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build /tmp/numi-matter-audit-build -j 3
          ctest \
            --test-dir /tmp/numi-matter-audit-build \
            --output-on-failure \
            -j 1

          c++ -std=c++23 -Wall -Wextra -Wpedantic -Werror \
            -I matter/include -I include \
            -fsyntax-only matter/src/metal_world.cpp

          python3 - <<'PY'
          from pathlib import Path
          import re

          metal = "\n".join(
              path.read_text()
              for path in Path("matter/src/metal").glob("*.metalinc")
          ) + "\n" + Path("matter/src/matter_kernels.metal").read_text()
          runtime = Path("matter/src/runtime.mm").read_text()
          definitions = set(re.findall(
              r"\bkernel\s+void\s+(nm_[A-Za-z0-9_]+)\s*\(",
              metal,
          ))
          references = set(re.findall(r'"(nm_[A-Za-z0-9_]+)"', runtime))
          if definitions != references:
              raise SystemExit(
                  f"Matter kernel mismatch: missing={sorted(references-definitions)} "
                  f"unused={sorted(definitions-references)}"
              )
          print(f"Matter kernels: {len(definitions)} definitions/references")
          PY

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit and harden Matter execution"
          git push \
            --force-with-lease=refs/heads/codex/matter-compiler-foundation:${GITHUB_SHA} \
            origin HEAD:codex/matter-compiler-foundation
