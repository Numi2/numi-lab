name: Integrate segmented Human horizon
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/integrate-segmented-human-horizon.yml]
permissions:
  contents: write
concurrency:
  group: integrate-segmented-human-horizon
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Numi2/numilab-human
          ref: bbf07157d6cc57265cfa401b8f1fafeeec61b3c9
          path: human-inputs
          sparse-checkout: |
            .numi/commands
            Docs/media/native-runtime-source-package-20260915
          persist-credentials: false
      - name: Apply bounded trace and authoritative segmentation
        shell: python
        run: |
          import base64, hashlib, pathlib, re, subprocess, zlib
          carrier = pathlib.Path('.github/workflows/integrate-bounded-human-trace.yml').read_text()
          trace_encoded = re.search(r"encoded = '([^']+)'", carrier).group(1)
          trace_patch = zlib.decompress(base64.b64decode(trace_encoded, validate=True))
          assert len(trace_patch) == 11134
          assert hashlib.sha256(trace_patch).hexdigest() == 'f9a48d7747a61f5b45ac5a0e78599215702943211c2e2976548864df88b01c49'
          subprocess.run(['git','apply','--check','-'], input=trace_patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=trace_patch, check=True)
          segmented_encoded = ''
          segmented_patch = zlib.decompress(base64.b64decode(segmented_encoded, validate=True))
          assert len(segmented_patch) == 15451
          assert hashlib.sha256(segmented_patch).hexdigest() == '1c439dbcd19f17ec3f429f77b750fe028b7f573a99ff62673536d906404389bf'
          subprocess.run(['git','apply','--check','-'], input=segmented_patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=segmented_patch, check=True)
          assert subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines() == ['apps/numilab_human_myosim_visual_probe.mm']
          subprocess.run(['git','diff','--cached','--check'], check=True)
      - name: Verify or install Metal toolchain
        run: |
          set -euo pipefail
          cat > /tmp/numi-segment-probe.metal <<'METAL'
          #include <metal_stdlib>
          using namespace metal;
          kernel void numi_segment_probe(device float* x [[buffer(0)]]) { if (x != nullptr) x[0] = x[0]; }
          METAL
          if ! xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-segment-probe.metal -o /tmp/numi-segment-probe.air >/tmp/metal-initial.txt 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal -std=metal4.0 -c /tmp/numi-segment-probe.metal -o /tmp/numi-segment-probe.air
      - name: Build complete Human target
        run: |
          python3 tools/check_human_host_syntax.py
          cmake -S . -B BuildHuman -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build BuildHuman --target metalrobo_numilab_human_myosim_visual_probe --parallel 3
      - name: Execute segmented source-bound horizon
        shell: python
        run: |
          import json, os, pathlib, shlex, subprocess
          root=pathlib.Path.cwd(); inputs=root/'human-inputs'
          receipt=json.loads((inputs/'Docs/media/native-runtime-source-package-20260915/source-package-receipt-v1.json').read_text())
          payloads={name:inputs/value['path'] for name,value in receipt['inputs'].items()}
          output=root/'segmented-horizon-evidence'; output.mkdir()
          command=[str(inputs/'.numi/commands/human'),'stand',str(payloads['rigid'].parent),
              str(output/'unused.nhbones'),str(payloads['tendon']),str(payloads['support_contact']),
              str(output/'frames'),'--mechanics-only','--steps','128','--timestep','0.00005']
          environment={**os.environ,'NUMI_LAB_ROOT':str(root),'NUMI_BUILD_DIR':str(root/'BuildHuman'),'MTL_DEBUG_LAYER':'1'}
          completed=subprocess.run(command,env=environment,text=True,capture_output=True,timeout=1500)
          (output/'stdout.txt').write_text(completed.stdout)
          (output/'stderr.txt').write_text(completed.stderr)
          if completed.returncode != 0: raise RuntimeError('segmented Human horizon failed')
          summaries=[line for line in completed.stdout.splitlines() if line.startswith('myosim_articulated_mechanics=')]
          if len(summaries)!=1: raise RuntimeError('missing mechanics summary')
          metrics={token.split('=',1)[0]:token.split('=',1)[1] for token in shlex.split(summaries[0]) if '=' in token}
          required={'myosim_articulated_mechanics':'ok','persistent_completed_steps':'128',
              'persistent_root_assistance':'none','stand_deterministic_replay':'bitwise',
              'persistent_max_acceleration_semantics':'pre_projection_total_delta_v_divided_by_timestep'}
          if any(metrics.get(key)!=value for key,value in required.items()):
              raise RuntimeError('segmented execution contract changed')
          trace_rows=[line.split('=',1)[1] for line in completed.stdout.splitlines() if line.startswith('persistent_stand_trace=')]
          if len(trace_rows)!=1: raise RuntimeError('missing trace')
          trace=json.loads(trace_rows[0])
          assert trace['schema']=='numi.human.persistent-stand-trace.v5'
          assert trace['driver']=='bounded_segment_production_horizon'
          assert trace['maximum_segment_steps']==2 and trace['sample_count']==65
          assert trace['endpoint_equivalent']=='bitwise'
          assert trace['endpoint_max_q_delta']==0 and trace['endpoint_max_v_delta']==0
          assert trace['samples'][0]['step']==0
          assert [row['step'] for row in trace['samples'][1:]]==list(range(2,129,2))
          stage_lines=[line for line in completed.stdout.splitlines() if line.startswith('human_execution_stage=')]
          assert any('native_horizon_end' in line and 'stage_step=128' in line for line in stage_lines)
          (output/'receipt.json').write_text(json.dumps({'schema':'numi.human.segmented-authoritative-horizon.v1',
              'native_source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'requested_steps':128,'maximum_submission_steps':32,'trace_samples':65,
              'endpoint_equivalent':'bitwise','qualification_boundary':'Watchdog-safe state transport and deterministic endpoint only; not standing or force convergence.'},indent=2)+'\n')
      - name: Publish tested source increment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Segment authoritative Human horizons without changing endpoints'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > segmented-horizon-evidence/source-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-segmented-horizon-evidence
          path: segmented-horizon-evidence
          retention-days: 14
          if-no-files-found: warn
