name: Materialize ARDY HyperPolicy integration

on:
  push:
    branches:
      - agent/ardy-hyperpolicy-production
    paths:
      - .github/hyperpolicy_integration_payload/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct production source payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          root = Path('.github/hyperpolicy_integration_payload')
          parts = [root / f'{index:02d}.part' for index in range(7)]
          encoded = b''.join(path.read_bytes() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'fd151020faab300c6f280d394e6c27b9985c068b3fe0007e5c14633ba8acce6a'
          if digest != expected:
              raise SystemExit(f'HyperPolicy payload hash mismatch: {digest}')
          Path('/tmp/ardy-hyperpolicy-integration.tar.gz').write_bytes(payload)
          PY
          tar -xzf /tmp/ardy-hyperpolicy-integration.tar.gz -C .

      - name: Adapt build integration to current Metal 4 tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('CMakeLists.txt')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          once(
              'set(METALROBO_POLICY_INFERENCE_SOURCE\n    "${CMAKE_CURRENT_SOURCE_DIR}/src/metal/PolicyInference.metal"\n)\n',
              'set(METALROBO_POLICY_INFERENCE_SOURCE\n    "${CMAKE_CURRENT_SOURCE_DIR}/src/metal/PolicyInference.metal"\n)\n'
              'set(METALROBO_HYPER_POLICY_SOURCE\n    "${CMAKE_CURRENT_SOURCE_DIR}/src/metal/HyperPolicy.metal"\n)\n',
              'HyperPolicy Metal source',
          )
          once(
              'set(METALROBO_POLICY_INFERENCE_AIR\n    "${METALROBO_SHADER_DIR}/MetalRoboPolicyInference.air"\n)\n',
              'set(METALROBO_POLICY_INFERENCE_AIR\n    "${METALROBO_SHADER_DIR}/MetalRoboPolicyInference.air"\n)\n'
              'set(METALROBO_HYPER_POLICY_AIR\n    "${METALROBO_SHADER_DIR}/MetalRoboHyperPolicy.air"\n)\n',
              'HyperPolicy AIR',
          )

          policy_compile = '''    COMMAND xcrun -sdk macosx metal
                  -std=metal4.0
                  -O3
                  -I "${CMAKE_CURRENT_SOURCE_DIR}/include"
                  -c "${METALROBO_POLICY_INFERENCE_SOURCE}"
                  -o "${METALROBO_POLICY_INFERENCE_AIR}"
          '''
          if policy_compile not in s:
              m = re.search(
                  r'(    COMMAND xcrun -sdk macosx metal\n'
                  r'            -std=metal4\.0\n'
                  r'            -O3\n'
                  r'            -I "\$\{CMAKE_CURRENT_SOURCE_DIR\}/include"\n'
                  r'            -c "\$\{METALROBO_POLICY_INFERENCE_SOURCE\}"\n'
                  r'            -o "\$\{METALROBO_POLICY_INFERENCE_AIR\}"\n)',
                  s,
              )
              if not m:
                  raise SystemExit('PolicyInference Metal compile block not found')
              policy_compile = m.group(1)
          hyper_compile = '''    COMMAND xcrun -sdk macosx metal
                  -std=metal4.0
                  -O3
                  -I "${CMAKE_CURRENT_SOURCE_DIR}/include"
                  -c "${METALROBO_HYPER_POLICY_SOURCE}"
                  -o "${METALROBO_HYPER_POLICY_AIR}"
          '''
          # Normalize indentation to the matched policy block.
          hyper_compile = policy_compile.replace(
              'METALROBO_POLICY_INFERENCE_SOURCE', 'METALROBO_HYPER_POLICY_SOURCE'
          ).replace(
              'METALROBO_POLICY_INFERENCE_AIR', 'METALROBO_HYPER_POLICY_AIR'
          )
          once(policy_compile, policy_compile + hyper_compile, 'HyperPolicy Metal compile block')

          # Add AIR to metallib link and both source/header to dependencies.
          once(
              '            "${METALROBO_POLICY_INFERENCE_AIR}"\n',
              '            "${METALROBO_POLICY_INFERENCE_AIR}"\n'
              '            "${METALROBO_HYPER_POLICY_AIR}"\n',
              'HyperPolicy metallib AIR',
          )
          once(
              '            "${METALROBO_POLICY_INFERENCE_SOURCE}"\n',
              '            "${METALROBO_POLICY_INFERENCE_SOURCE}"\n'
              '            "${METALROBO_HYPER_POLICY_SOURCE}"\n',
              'HyperPolicy shader source dependency',
          )
          once(
              '            "${CMAKE_CURRENT_SOURCE_DIR}/include/metalrobo/policy_program_types.h"\n',
              '            "${CMAKE_CURRENT_SOURCE_DIR}/include/metalrobo/policy_program_types.h"\n'
              '            "${CMAKE_CURRENT_SOURCE_DIR}/include/metalrobo/hyper_policy_program_types.h"\n',
              'HyperPolicy ABI dependency',
          )

          # Explicit C++/Objective-C++ units: no reliance on source globbing.
          once(
              '    src/core/PolicyProgram.cpp\n',
              '    src/core/PolicyProgram.cpp\n'
              '    src/core/HyperPolicyProgram.cpp\n'
              '    src/core/HyperPolicyPacks.cpp\n',
              'HyperPolicy core sources',
          )
          once(
              '    src/metal/MetalWorld.mm\n',
              '    src/metal/MetalWorld.mm\n'
              '    src/metal/MetalHyperPolicy.mm\n',
              'MetalHyperPolicy runtime source',
          )
          p.write_text(s)

          # The payload patcher owns every non-CMake integration seam. Skip its
          # stale build-file function because the live tree is already Metal 4.
          q = Path('tools/apply_ardy_hyperpolicy_integration.py')
          t = q.read_text()
          t = t.replace('    patch_cmake()\n', '', 1)
          q.write_text(t)
          PY

      - name: Integrate runtime, rollout, learner and CLI seams
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_ardy_hyperpolicy_integration.py

      - name: Publish completed implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/hyperpolicy_integration_payload
          rm -f .github/workflows/ardy-hyperpolicy-materialize.yml
          rm -f SOURCE_SHA256SUMS
          # Keep the integration script: it documents every intentional seam
          # between generated policy artifacts and the native executor.
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Complete ARDY HyperPolicy native integration"
          git push origin HEAD:agent/ardy-hyperpolicy-production
