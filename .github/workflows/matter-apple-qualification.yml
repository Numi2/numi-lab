name: Matter Apple qualification

on:
  push:
    branches: [codex/matter-compiler-foundation]
  pull_request:
    branches: [numisolver]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-matter-apple -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-matter-apple --target metalrobo_matter_physics_probe numi-matterc -j 3
      - name: Qualify
        run: ctest --test-dir build-matter-apple -L matter --output-on-failure -j 1
