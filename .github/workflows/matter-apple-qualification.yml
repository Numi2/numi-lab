name: Matter Apple qualification

on:
  pull_request:
    branches: [numisolver]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matter-apple-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-matter-apple -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-matter-apple --target metalrobo_matter_physics_probe numi-matterc numi-matter-stateful-check -j 3
      - name: Qualify
        run: ctest --test-dir build-matter-apple -L matter --output-on-failure -j 1
