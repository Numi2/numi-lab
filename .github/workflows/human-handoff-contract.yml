name: Human static-dynamic handoff contract

on:
  push:
    branches: [coupled]
    paths:
      - "include/metalrobo/NumiHumanStaticDynamicHandoff.hpp"
      - "include/metalrobo/NumiHumanMuscleEquilibrium.hpp"
      - "src/core/NumiHumanMuscleEquilibrium.cpp"
      - "apps/numilab_human_myosim_visual_probe.mm"
      - "tests/numi_human_static_dynamic_handoff_cases.hpp"
      - "tests/numi_human_initial_state_test.cpp"
      - ".github/workflows/human-handoff-contract.yml"
  pull_request:
    paths:
      - "include/metalrobo/NumiHumanStaticDynamicHandoff.hpp"
      - "include/metalrobo/NumiHumanMuscleEquilibrium.hpp"
      - "src/core/NumiHumanMuscleEquilibrium.cpp"
      - "apps/numilab_human_myosim_visual_probe.mm"
      - "tests/numi_human_static_dynamic_handoff_cases.hpp"
      - "tests/numi_human_initial_state_test.cpp"
      - ".github/workflows/human-handoff-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure focused native tests
        run: >-
          cmake -S . -B build-human-handoff -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DNUMANX_FULLBODY_RIGID_ASSET=${{ github.workspace }}/CMakeLists.txt
          -DNUMANX_FULLBODY_MUSCLE_ASSET=${{ github.workspace }}/CMakeLists.txt
          -DNUMANX_FULLBODY_SUPPORT_CONTACT_ASSET=${{ github.workspace }}/CMakeLists.txt
          -DNUMANX_FULLBODY_VISUAL_PACK_ASSET=${{ github.workspace }}/CMakeLists.txt
          -DNUMANX_FULLBODY_VISION_PROFILE_ASSET=${{ github.workspace }}/CMakeLists.txt
      - name: Build Human equilibrium, app, and handoff tests
        run: >-
          cmake --build build-human-handoff
          --target metalrobo_numi_human_initial_state_test metalrobo_numilab_human_myosim_visual_probe
          -j 3
      - name: Run NHINIT and handoff contract tests
        run: ctest --test-dir build-human-handoff -R '^numi_human_initial_state$' --output-on-failure -j 1
