name: Human constraint projection
on:
  push:
    branches: [human-native-runtime-20260915]
    paths:
      - include/metalrobo/numi_human_constraint_projection.h
      - src/metal/NumiHumanStand.metal
      - apps/numilab_human_myosim_visual_probe.mm
      - tests/numi_human_constraint_projection_test.cpp
      - tests/numi_human_equality_limit_block_test.cpp
      - tools/check_human_constraint_owner.py
      - .github/workflows/human-constraint-projection.yml
  pull_request:
    paths:
      - include/metalrobo/numi_human_constraint_projection.h
      - src/metal/NumiHumanStand.metal
      - apps/numilab_human_myosim_visual_probe.mm
      - tests/numi_human_constraint_projection_test.cpp
      - tests/numi_human_equality_limit_block_test.cpp
      - tools/check_human_constraint_owner.py
      - .github/workflows/human-constraint-projection.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: human-constraint-projection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check production constraint ownership
        run: python3 tools/check_human_constraint_owner.py
      - name: Test shared projection and block policies
        run: |
          for name in constraint_projection equality_limit_block; do
            c++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/numi_human_${name}_test.cpp -o /tmp/human-${name}
            /tmp/human-${name}
          done
          git diff --exit-code
  metal-compile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile production Metal constraint owner
        run: xcrun --sdk macosx metal -std=metal3.1 -Iinclude -c src/metal/NumiHumanStand.metal -o /tmp/NumiHumanStand.air
      - name: Test shared policies with Apple clang
        run: |
          for name in constraint_projection equality_limit_block; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/numi_human_${name}_test.cpp -o /tmp/human-${name}
            /tmp/human-${name}
          done
      - name: Check production constraint ownership
        run: python3 tools/check_human_constraint_owner.py
