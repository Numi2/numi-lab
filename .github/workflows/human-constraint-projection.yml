name: Human constraint projection
on:
  push:
    branches: [human-native-runtime-20260915]
    paths:
      - include/metalrobo/numi_human_constraint_projection.h
      - tests/numi_human_constraint_projection_test.cpp
      - tools/apply_human_constraint_projection.py
      - .github/workflows/human-constraint-projection.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: human-constraint-projection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source correction
        run: python3 tools/apply_human_constraint_projection.py
      - name: Test shared projection policy
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/numi_human_constraint_projection_test.cpp -o /tmp/human-constraint-projection
          /tmp/human-constraint-projection
          git diff --check
      - name: Publish corrected native owner
        id: publish
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          test "$TARGET_BRANCH" = human-native-runtime-20260915
          if ! git diff --quiet -- src/metal/NumiHumanStand.metal; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- src/metal/NumiHumanStand.metal
            git commit -m 'Fix Human support impulse ownership and releasable limits'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: human-constraint-projection-source
          path: |
            src/metal/NumiHumanStand.metal
            include/metalrobo/numi_human_constraint_projection.h
            tests/numi_human_constraint_projection_test.cpp
  metal-compile:
    needs: integrate
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source_sha }}
      - name: Compile production Metal constraint owner
        run: xcrun --sdk macosx metal -std=metal3.1 -Iinclude -c src/metal/NumiHumanStand.metal -o /tmp/NumiHumanStand.air
      - name: Test shared policy with Apple clang
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/numi_human_constraint_projection_test.cpp -o /tmp/human-constraint-projection
          /tmp/human-constraint-projection
