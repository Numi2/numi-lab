name: Integrate Human inertia-column cache
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/integrate-human-inertia-cache.yml, tools/human-inertia-cache-20260918.patch]
permissions:
  contents: write
concurrency:
  group: integrate-human-inertia-cache
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-checked cache and rotated-inertia regressions
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('tools/human-inertia-cache-20260918.patch').read_text().replace('\n diff --git ', '\ndiff --git ')
          subprocess.run(['git','apply','--check','-'],input=patch.encode(),check=True)
          subprocess.run(['git','apply','--index','-'],input=patch.encode(),check=True)
          expected = {
              'include/metalrobo/numi_human_stand_gpu.h':'bdf97db2cb3acb5b9d60ce6626448b3e00e02cfe9d42ed84f17dc716e77f52dd',
              'src/metal/NumiHumanStand.metal':'4e5155b8bfcb836f0d3ddf06ccde75b270ed6cef3fffb727cc3c10ed32967f7f',
              'src/metal/MetalArticulatedOperator.mm':'4de21a03f67d8102d4b863c993802468f63659a3c827db24318fd4c8c009bd7a',
              'tests/numi_human_bilateral_metal_test.mm':'82327dacb812012c09d5d05ed94a4eda774ce1b92bf61d1bc2a1b40cd05c61fb',
              'tests/numi_human_friction_metal_test.mm':'55be3286d6a9b738489f3a7ccdec65c57f4cdf7dd699cfde9def22d66687e15c',
              'tests/numi_human_passive_metal_test.mm':'4c07418f8e39ba06fca277e5f6c05b66e5e881bc40666be80b31748f7b34318a',
          }
          for path,digest in expected.items():
              actual=hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert actual==digest,(path,actual,digest)
      - name: Check production ownership and host compilation
        run: |
          set -eu
          mkdir -p inertia-cache-evidence
          python3 tools/check_human_constraint_owner.py
          python3 tools/check_human_host_syntax.py
          git diff --cached --check
      - name: Execute actual Metal regressions
        run: |
          set -eu
          xcrun --sdk macosx metal -std=metal4.0 -fno-fast-math -Iinclude -c src/metal/NumiHumanStand.metal -o /tmp/NumiHumanStand.air
          xcrun --sdk macosx metallib /tmp/NumiHumanStand.air -o /tmp/NumiHumanStand.metallib
          for name in passive friction bilateral; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-fast-math -fobjc-arc -Iinclude tests/numi_human_${name}_metal_test.mm -framework Foundation -framework Metal -o /tmp/human-${name}-metal
            MTL_DEBUG_LAYER=1 /tmp/human-${name}-metal /tmp/NumiHumanStand.metallib > inertia-cache-evidence/${name}-stdout.txt 2> inertia-cache-evidence/${name}-stderr.txt
            cat inertia-cache-evidence/${name}-stdout.txt
          done
      - name: Publish verified numerical sources
        run: |
          test "$GITHUB_REF_NAME" = human-native-runtime-20260915
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Cache Human world-inertia Jacobian columns before dense mass assembly'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > inertia-cache-evidence/source-revision.txt
          git diff HEAD^ HEAD > inertia-cache-evidence/integrated.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-inertia-cache-integration
          path: inertia-cache-evidence
          retention-days: 14
          if-no-files-found: warn
