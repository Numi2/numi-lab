name: Integrate Human velocity diagnostics
on:
  push:
    branches: [human-native-runtime-20260915]
    paths: [.github/workflows/human-velocity-diagnostics-integrate.yml]
permissions:
  contents: write
concurrency:
  group: human-velocity-diagnostics-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source patch
        shell: python
        run: |
          import base64, hashlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 24743
          assert hashlib.sha256(patch).hexdigest() == '95a1ea14be68c7b95f525ad66e4c3bb2e79f858a59013b9e8163da61fd5db584'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
      - name: Verify portable numerical contracts
        run: |
          set -eu
          for name in constraint_projection equality_limit_block passive_joint friction; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Iinclude tests/numi_human_${name}_test.cpp -o /tmp/human-${name}
            /tmp/human-${name}
          done
          python3 tools/check_human_constraint_owner.py
          git diff --cached --check
      - name: Compile and exercise production owners
        run: |
          set -eu
          xcrun --sdk macosx metal -std=metal4.0 -fno-fast-math -Iinclude -c src/metal/NumiHumanStand.metal -o /tmp/NumiHumanStand.air
          xcrun --sdk macosx metallib /tmp/NumiHumanStand.air -o /tmp/NumiHumanStand.metallib
          python3 tools/check_human_host_syntax.py
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-fast-math -fobjc-arc -Iinclude tests/numi_human_passive_metal_test.mm -framework Foundation -framework Metal -o /tmp/human-passive-metal
          set +e
          MTL_DEBUG_LAYER=1 /tmp/human-passive-metal /tmp/NumiHumanStand.metallib
          code=$?
          set -e
          if [ "$code" != 0 ] && [ "$code" != 77 ]; then exit "$code"; fi
      - name: Publish verified source increment
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = human-native-runtime-20260915
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Numi2@users.noreply.github.com'
          git commit -m 'Separate Human smooth acceleration from constraint velocity jumps'
          git push origin HEAD:refs/heads/human-native-runtime-20260915
          git rev-parse HEAD > human-velocity-diagnostics-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-velocity-diagnostics-integration
          path: human-velocity-diagnostics-revision.txt
          retention-days: 14
          if-no-files-found: warn
